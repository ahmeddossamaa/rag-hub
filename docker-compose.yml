services:
  weaviate:
    image: semitechnologies/weaviate:1.28.4
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      # Increase disk usage limits to avoid ReadOnly mode (current usage ~93%)
      DISK_USE_WARNING_PERCENTAGE: "95"
      DISK_USE_READONLY_PERCENTAGE: "99"
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      # Switch to wget as curl might be missing in the image
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hipaa-network

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
    environment:
      - WEAVIATE_URL=http://weaviate:8080
    env_file:
      - .env
    depends_on:
      weaviate:
        condition: service_healthy
    networks:
      - hipaa-network
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi
    networks:
      - hipaa-network

volumes:
  weaviate_data:

networks:
  hipaa-network:
    driver: bridge
